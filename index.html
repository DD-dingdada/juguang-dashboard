<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {

    background: #0f1419;

  .update-time { font-size: 13px; color: #71767b; }

  }
  .btn:hover { background: #1a8cd8; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn .spinner {
    width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.3);

  }

  /* ===== 消费数据卡片 ===== */

    max-width: 1300px; margin: 0 auto 16px;

  }
  .grid {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 18px; max-width: 1300px; margin: 0 auto 36px;
  }
  .card {
    background: #1a1f26; border-radius: 16px; padding: 24px;
    border: 1px solid #2f3336; position: relative; overflow: hidden;
    transition: border-color 0.3s;
  }
  .card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
  }
  .card.laopin::before { background: #3b82f6; }
  .card.xinpin::before { background: #10b981; }
  .card.zhengrui::before { background: #f59e0b; }
  .card-name {
    font-size: 18px; font-weight: 700; margin-bottom: 20px;
    display: flex; align-items: center; gap: 8px;
  }
  .card-name .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .card.laopin .dot { background: #3b82f6; }
  .card.xinpin .dot { background: #10b981; }
  .card.zhengrui .dot { background: #f59e0b; }
  .metrics { display: flex; flex-direction: column; gap: 16px; }
  .metric { }
  .metric-label { font-size: 12px; color: #71767b; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
  .metric-value { font-size: 28px; font-weight: 700; }
  .metric-value.cost { color: #e74c3c; }
  .metric-value.price { color: #f59e0b; }
  .metric-value.leads { color: #10b981; }
  .metric-sub {
    font-size: 11px; color: #536471; margin-top: 2px;

  }
  .metric-sub span { background: #27303a; padding: 1px 6px; border-radius: 4px; }

  /* ===== 排班卡片 ===== */
  .schedule-grid {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 20px; max-width: 1300px; margin: 0 auto;
  }
  .sc-card {

  .sc-all-list::-webkit-scrollbar { width: 4px; }

  .sc-all-item {

  .sc-footer {

  .sc-empty {
    text-align: center; color: #536471; font-size: 13px; padding: 20px;

  /* Loading / error */
  .loading-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(15,20,25,.6); display: flex; align-items: center;
    justify-content: center; z-index: 100; transition: opacity 0.3s;
  }
  .loading-overlay.hidden { opacity: 0; pointer-events: none; }
  .loading-box {
    background: #1a1f26; border-radius: 12px; padding: 24px 36px;
    text-align: center; border: 1px solid #2f3336;
  }
  .loading-box .spinner-big {
    width: 32px; height: 32px; border: 3px solid #2f3336;
    border-top-color: #1d9bf0; border-radius: 50%; animation: spin 0.8s linear infinite;
    margin: 0 auto 12px;
  }
  .error-msg { color: #e74c3c; font-size: 13px; text-align: center; margin-top: 8px; }
  .auto-tag { font-size: 11px; color: #536471; background: #27303a; padding: 2px 8px; border-radius: 10px; }

  /* 排班手动刷新按钮 */
  .btn-schedule-refresh {
    background: none; border: 1px solid #2f3336; color: #71767b;
    padding: 2px 8px; border-radius: 6px; font-size: 12px; cursor: pointer;
    transition: all 0.2s; margin-left: 8px; vertical-align: middle;
  }
  .btn-schedule-refresh:hover { color: #1d9bf0; border-color: #1d9bf0; }
  .btn-schedule-refresh:disabled { opacity: 0.4; cursor: not-allowed; }

  /* 进度条 */
  .sc-progress-wrap { margin-top: 10px; }
  .sc-progress-bar {
    height: 4px; background: #2f3336; border-radius: 2px; overflow: hidden;
  }
  .sc-progress-fill {
    height: 100%; border-radius: 2px; transition: width 0.5s;
  }
  .sc-progress-fill.tj { background: #e74c3c; }
  .sc-progress-fill.sy { background: #3b82f6; }
  .sc-progress-fill.xa { background: #10b981; }
  .sc-progress-fill.jn { background: #f59e0b; }
  .sc-progress-info {
    display: flex; justify-content: space-between; margin-top: 4px;
    font-size: 10px; color: #536471;
  }

  @media (max-width: 800px) {
    .grid { grid-template-columns: 1fr; }
    .schedule-grid { grid-template-columns: 1fr; }
    .header { flex-direction: column; gap: 12px; align-items: flex-start; }
  }
</style>

<script>
const DATA_API = '/api/data';
const SCHEDULE_API = '/api/schedule';
const REFRESH_INTERVAL = 3600000;

let timer = null;
let countdownTimer = null;
let oldSpendData = null;
let oldScheduleData = null;

/* ===== 倒计时 ===== */
function msUntilNextHour() {
  const now = new Date();
  const next = new Date(now);
  next.setHours(next.getHours() + 1, 0, 0, 0);
  return next - now;
}

function updateCountdown() {
  const ms = msUntilNextHour();
  const m = Math.floor(ms / 60000);
  const s = Math.floor((ms % 60000) / 1000);
  document.getElementById('autoTag').textContent =
    '⏱ ' + m + '分' + s + '秒后整点刷新';
}

/* ===== 消费数据 ===== */
async function refreshSpend(silent) {
  const btn = document.getElementById('refreshBtn');
  const overlay = document.getElementById('loadingOverlay');
  const errorEl = document.getElementById('errorMsg');

  if (!silent) overlay.classList.remove('hidden');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> 抓取中';
  errorEl.style.display = 'none';

  try {
    const res = await fetch(DATA_API);
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || '未知错误');
    renderSpend(json.data);
    oldSpendData = json.data;
    const ts = new Date((json.updated_at || Date.now() / 1000) * 1000);
    document.getElementById('updateTime').textContent =
      '更新于 ' + ts.toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
    document.getElementById('autoTag').textContent = json.cached ? '📦 缓存命中' : '✅ 实时数据';
  } catch(e) {
    errorEl.textContent = '❌ ' + e.message;
    errorEl.style.display = 'block';
    if (oldSpendData) renderSpend(oldSpendData);
  } finally {
    overlay.classList.add('hidden');
    btn.disabled = false;
    btn.innerHTML = '🔄 刷新';
  }
}

function renderSpend(data) {
  const map = {
    '老全品': { cls: 'laopin', detailId: 'detail-laopin' },
    '新全品': { cls: 'xinpin', detailId: 'detail-xinpin' },
    '郑瑞':   { cls: 'zhengrui', detailId: 'detail-zhengrui' },
  };

  for (const item of data) {
    const cfg = map[item.name];
    if (!cfg) continue;
    const card = document.querySelector(`.card.${cfg.cls}`);
    if (!card) continue;
    card.querySelector('.cost').textContent = '¥ ' + (item.cost_str || '--');
    card.querySelector('.price').textContent = '¥ ' + (item.price_str || '--');
    card.querySelector('.leads').textContent = item.leads != null ? item.leads : '--';

    if (item.details && item.details.length > 0) {
      const detailEl = document.getElementById(cfg.detailId);
      detailEl.innerHTML = item.details.map(d =>
        `<span>${d.name.replace('lk-沈阳','').replace('学而思网校优课','网校').replace('希望名师好课推荐','希望').replace('郑瑞线上化学','郑瑞').replace('甄选视频户','视频').replace('增量户','增量')} ¥${d.cost.toLocaleString()} / ${d.leads}条</span>`
      ).join('');
    }

    const vs = card.querySelectorAll('.metric-value');
    vs.forEach(v => { v.style.transition = 'none'; v.style.transform = 'scale(1)'; });
    requestAnimationFrame(() => {
      vs.forEach(v => { v.style.transition = 'transform 0.2s'; v.style.transform = 'scale(1.05)'; });
      setTimeout(() => { vs.forEach(v => { v.style.transform = 'scale(1)'; }); }, 200);
    });
  }
}

/* ===== 排班数据 ===== */
function accountClass(name) {
  if (name.includes('郑瑞')) return 'zr';
  if (name.includes('希望') || name.includes('好课推荐')) return 'lqp';
  if (name.includes('甄选')) return 'xqp';
  return 'other';
}

function budgetStr(val) {
  if (val === null || val === undefined) return '∞';
  if (val >= 1000) return (val / 1000).toFixed(1).replace('.0','') + 'k';
  return String(val);
}

function shortName(name) {
  if (name.includes('郑瑞')) return '郑瑞';
  if (name.includes('希望') || name.includes('好课推荐')) return '老全品';
  if (name.includes('甄选')) return '新全品';
  return name.length > 12 ? name.slice(0,12) + '...' : name;
}

function renderSchedule(data) {
  const grid = document.getElementById('scheduleGrid');
  let accounts = (data && data.accounts) || [];

  if (!accounts.length) {
    grid.innerHTML = '<div class="sc-card"><div class="sc-empty">暂无排班数据</div></div>';
    return;
  }

  // 统一排序：老全品 → 郑瑞 → 新全品
  const orderMap = { '老全品': 0, '郑瑞': 1, '新全品': 2 };
  accounts.sort((a, b) => {
    const sa = shortName(a.name);
    const sb = shortName(b.name);
    return (orderMap[sa] ?? 99) - (orderMap[sb] ?? 99);
  });

  grid.innerHTML = accounts.map(acc => {
    const teachers = acc.teachers || [];
    const duty = acc.duty || {};
    const cls = accountClass(acc.name);
    const totalB = acc.total_budget;

    // 当前承接人
    const curName = duty.current || '—';
    const curStart = duty.current_start ?? 0;
    const curEnd = duty.current_end ?? (duty.current_budget || 0);
    const progress = duty.progress || 0;

    // 下一棒
    const nextName = duty.next || '—';
    const nextStart = duty.next_start;
    const nextEnd = duty.next_end;

    // 当前老师显示：预算 + 剩余（结合投放数据）
    let curBudgetStr = '';
    if (duty.status === '全天已结束') {
      curBudgetStr = '全天已结束';
    } else if (curEnd != null && curEnd >= 999999000) {
      curBudgetStr = `不限预算（${curStart.toLocaleString()}+）`;
    } else {
      const cb = duty.current_budget || 0;
      const rem = duty.remaining != null ? duty.remaining : cb;
      curBudgetStr = `预算 ¥${cb.toLocaleString()} | 剩余 ¥${rem.toLocaleString()}`;
    }

    let progressHtml = '';
    if (duty.status !== '全天已结束' && curEnd != null && curEnd < 999999000) {
      progressHtml = `<div class="sc-progress-wrap">
        <div class="sc-progress-bar"><div class="sc-progress-fill ${cls}" style="width:${progress}%"></div></div>
        <div class="sc-progress-info"><span>${duty.status || ''}</span><span>${progress}%</span></div>
      </div>`;
    }

    // 下一棒显示区间
    let nextHtml = '';
    if (nextName && nextName !== '—' && nextName !== '最后一棒' && nextName !== '已结束') {
      let nextRange = '';
      if (nextEnd != null && nextEnd < 999999000) {
        nextRange = `${(nextStart || 0).toLocaleString()}-${nextEnd.toLocaleString()}`;
      } else if (nextEnd != null) {
        nextRange = '不限';
      }
      nextHtml = `<div class="sc-next-section">
        <div><span class="sc-next-label">下一棒</span><br><span class="sc-next-name">${nextName}</span></div>
        <span class="sc-next-budget">${nextRange}</span>
      </div>`;
    } else if (nextName === '最后一棒') {
      nextHtml = `<div class="sc-next-section">
        <div><span class="sc-next-label">下一棒</span><br><span class="sc-next-name" style="color:#536471">最后一棒</span></div>
        <span class="sc-next-budget" style="color:#536471">—</span>
      </div>`;
    } else if (nextName === '已结束') {
      nextHtml = `<div class="sc-next-section">
        <div><span class="sc-next-label" style="color:#e74c3c">全天已结束</span></div>
      </div>`;
    }

    // 全部老师列表（默认折叠）— 显示累积区间
    const allNames = duty.all_teachers || teachers.map(t => t.name);
    let allListHtml = allNames.map((n, i) => {
      const isNow = n === curName && duty.status === '进行中';
      let range = '';
      if (i < teachers.length) {
        const t = teachers[i];
        const prev = i > 0 ? teachers[i - 1].cumulative : 0;
        if (t.cumulative >= 999999000) {
          range = `${prev.toLocaleString()}+`;
        } else {
          range = `${prev.toLocaleString()}-${t.cumulative.toLocaleString()}`;
        }
      }
      return `<div class="sc-all-item${isNow ? ' now' : ''}">
        <span class="t-name">${n}</span>
        <span class="t-budget">${range}</span>
      </div>`;
    }).join('');

    let footerHtml = '';
    if (totalB != null && totalB < 999999000) {
      footerHtml = `<div class="sc-footer"><span class="total">全天总预算</span><span class="total-val">¥ ${totalB.toLocaleString()}</span></div>`;
    } else {
      footerHtml = `<div class="sc-footer"><span class="total">全天总预算</span><span class="total-val">不限</span></div>`;
    }

    return `<div class="sc-card ${cls}">
      <div class="sc-card-header">
        <span class="sc-card-name">${shortName(acc.name)}</span>
        <span class="sc-card-badge">${acc.teacher_count}人承接</span>
      </div>

      <div class="sc-current-section">
        <div class="sc-current-label">🟢 正在接客资</div>
        <div class="sc-current-name">${curName}</div>
        <div class="sc-current-budget">${curBudgetStr}</div>
      </div>

      ${progressHtml}
      ${nextHtml}

      <div class="sc-all-toggle" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'':'none';this.textContent=this.textContent.startsWith('▼')?'▶ 全部排班 ('+(this.nextElementSibling.children.length)+'棒)':'▼ 收起'">
        ▶ 全部排班 (${allNames.length}棒)
      </div>
      <div class="sc-all-list" style="display:none">${allListHtml}</div>

      ${footerHtml}
    </div>`;
  }).join('');
}

async function refreshSchedule() {
  try {
    const res = await fetch(SCHEDULE_API);
    const json = await res.json();
    if (json.ok) {
      oldScheduleData = json.data;
      renderSchedule(json.data);
    } else {
      console.error('Schedule error:', json.error);
    }
  } catch(e) {
    console.error('Schedule fetch error:', e);
    if (oldScheduleData) renderSchedule(oldScheduleData);
  }
}

async function refreshScheduleForce() {
  var btn = document.getElementById('scheduleRefreshBtn');
  var grid = document.getElementById('scheduleGrid');
  btn.disabled = true;
  btn.textContent = '⏳';

  try {
    var res = await fetch('/api/schedule/refresh', { method: 'POST' });
    var json = await res.json();
    if (json.ok) {
      oldScheduleData = json.data;
      renderSchedule(json.data);
      btn.textContent = '✅';
    } else {
      btn.textContent = '❌';
      console.error('Force refresh error:', json.error);
    }
  } catch(e) {
    btn.textContent = '❌';
    console.error('Force refresh fetch error:', e);
  } finally {
    setTimeout(function() { btn.disabled = false; btn.textContent = '🔄'; }, 2000);
  }
}

/* ===== 统一刷新 ===== */
async function refreshAll() {
  await Promise.all([refreshSpend(false), refreshSchedule()]);
}

/* ===== 启动 ===== */
// 先检查是否有内联快照数据（CloudStudio 部署版），有则秒开
if (window.__SPEND_DATA__) {
  renderSpend(window.__SPEND_DATA__);
  oldSpendData = window.__SPEND_DATA__;
  document.getElementById('updateTime').textContent =
    '更新于 ' + (window.__SNAPSHOT_TIME__ || '--');
  // 快照模式下 API 必须用绝对路径指向本机
  window._SNAPSHOT_API = 'http://localhost:5555/api/data';
  window._SNAPSHOT_SCHEDULE_API = 'http://localhost:5555/api/schedule';
  document.getElementById('autoTag').style.display = 'none';
  document.getElementById('refreshBtn').onclick = tryRefreshFromLocal;
  document.getElementById('refreshBtn').innerHTML = '🔄 刷新';
  // 关闭加载覆盖层（快照模式下不走 refreshAll 的 finally）
  document.getElementById('loadingOverlay').classList.add('hidden');
}
if (window.__SCHEDULE_DATA__) {
  renderSchedule(window.__SCHEDULE_DATA__);
  oldScheduleData = window.__SCHEDULE_DATA__;
}

/* ===== 快照模式：尝试本地刷新 ===== */
async function tryRefreshFromLocal() {
  var btn = document.getElementById('refreshBtn');
  var overlay = document.getElementById('loadingOverlay');
  var timeEl = document.getElementById('updateTime');
  var tagEl = document.getElementById('autoTag');
  var errorEl = document.getElementById('errorMsg');

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> 刷新中';
  overlay.classList.remove('hidden');
  errorEl.style.display = 'none';

  // 公网页面（手机）→ 模拟链接点击跳转，移动端最可靠的方式
  if (window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
    tagEl.textContent = '重新加载中…';
    var a = document.createElement('a');
    a.href = location.pathname + '?v=' + Date.now();
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    return;
  }

  try {
    var res = await fetch(window._SNAPSHOT_API);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    var json = await res.json();
    if (!json.ok) throw new Error(json.error || '未知错误');
    renderSpend(json.data);
    oldSpendData = json.data;
    var ts = new Date((json.updated_at || Date.now() / 1000) * 1000);
    timeEl.textContent = '更新于 ' + ts.toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
    tagEl.textContent = '更新于 ' + ts.toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
    btn.disabled = false;
    btn.innerHTML = '🔄 刷新';
    overlay.classList.add('hidden');

    // 顺便刷新排班
    try {
      var schRes = await fetch(window._SNAPSHOT_SCHEDULE_API);
      var schJson = await schRes.json();
      if (schJson.ok) { renderSchedule(schJson.data); oldScheduleData = schJson.data; }
    } catch(_) {}
  } catch(e) {
    // 本地但 API 不通 → 回退显示快照时间（无标签）
    timeEl.textContent = '更新于 ' + (window.__SNAPSHOT_TIME__ || '--');
    tagEl.textContent = '⚠ 只能本地刷新';
    errorEl.textContent = '💡 当前为公网快照。如需实时数据，请在电脑上打开 http://localhost:5555';
    errorEl.style.display = 'block';
    btn.disabled = false;
    btn.innerHTML = '🔄 刷新';
    overlay.classList.add('hidden');
  }
}

// 本地环境（有 live API）：后台尝试获取实时数据
var _isLocal = !window.__SPEND_DATA__;
if (_isLocal) {
  document.getElementById('refreshBtn').onclick = refreshAll;
  refreshAll();
  timer = setTimeout(() => {
    refreshAll();
    clearTimeout(timer);
    timer = setInterval(refreshAll, REFRESH_INTERVAL);
  }, msUntilNextHour());
}

countdownTimer = _isLocal ? setInterval(updateCountdown, 1000) : null;
if (_isLocal) updateCountdown();
</script>
